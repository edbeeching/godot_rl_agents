name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  check_code_quality:
    name: Check code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: 3.10.10
      - name: Install dependencies
        run: uv pip install --system ".[dev]"
      - name: Code quality
        run: |
          make quality
