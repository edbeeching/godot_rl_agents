name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests_ubuntu:
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10.10]
        os: ['ubuntu-latest']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv pip install --system .[test,sf]
    - name: Download examples
      run: |
        make download_examples

    - name: Test with pytest
      run: |
        make test
  tests_windows:
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10.10]
        os: ['windows-latest']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv pip install --system .[test]
    - name: Download examples
      run: |
        make download_examples

    - name: Test with pytest
      run: |
        make test


  tests_ubuntu_rllib:
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10.10]
        os: ['ubuntu-latest']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv pip install --system .[test]
    - name: Install Rllib
      run: |
        uv pip uninstall --system stable-baselines3 gymnasium
        uv pip install --system "ray[rllib]<=2.38.0" onnx==1.16.1
    - name: Download examples
      run: |
        make download_examples

    - name: Test with pytest
      run: |
        make test
  tests_windows_rllib:
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10.10]
        os: ['windows-latest']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv pip install --system .[test]
    - name: Install Rllib
      run: |
        uv pip uninstall --system stable-baselines3 gymnasium
        uv pip install --system "ray[rllib]<=2.38.0" onnx==1.16.1
    - name: Download examples
      run: |
        make download_examples

    - name: Test with pytest
      run: |
        make test
